name: smoke

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ptm-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice

      - name: Python deps
        run: pip install -r requirements.txt

      - name: PDK env
        run: |
          cat > config/pdk_env.local.json <<'EOF'
          {
            "env": {
              "SMC_ROOT": "vendor/spice_model_collections"
            }
          }
          EOF

      - name: Smoke pipeline
        run: bash scripts/run_smoke.sh
