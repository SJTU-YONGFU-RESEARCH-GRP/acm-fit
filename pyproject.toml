[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acm-fit"
version = "0.1.0"
description = "End-to-end compact model fitting on open PDK and PTM goldens"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "CC-BY-4.0" }
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "optuna>=3.0",
  "cmaes>=0.10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["acm*"]

[project.scripts]
acm-pipeline = "acm.cli.pipeline:main"
acm-eval = "acm.cli.eval:main"
acm-reports = "acm.cli.reports:main"
acm-corner = "acm.cli.corner:main"
acm-figures = "acm.cli.figures:main"
acm-golden-validate = "acm.cli.golden_validate:main"
acm-golden-scaffold = "acm.cli.golden_scaffold:main"
acm-golden-convert = "acm.cli.golden_convert:main"
