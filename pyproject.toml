[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acm-fit"
version = "0.1.0"
description = "End-to-end compact model fitting on open PDK and PTM goldens"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "optuna>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
